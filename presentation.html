<!DOCTYPE html>
<html lang="en">
  <!-- keep this valid HTML5 http://html5.validator.nu/ -->
  <head>
    <meta charset="UTF-8" />

    <style type="text/css">
      :root {
        --font-color: black;
        --bg-color: white;
        --bg-image: url("");
        --fixed-image: url("");
        --fg-image: url("");
        --pick-color: var(--song-color); /* the part on screen in Whole song and Grid */
        /* The app's theme (style.css), light; syncTheme() puts in the app's own as it changes */
        --background-color: white;
        --background-color-rgb: 255,255,255;
        --text-color: black;
        --light-text-color: #555;
        --box-shadow-var: 0 0 20px 2px rgba(0, 0, 0, 0.2);
        --btn-shadow-var: 0 2px 2px 2px rgba(0, 0, 0, 0.1);
        --btn-color: white;
        --btn-edge: transparent;
        --song-color: lightblue;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background-color: #121212;
          --background-color-rgb: 18,18,18;
          --text-color: white;
          --light-text-color: #bbb;
          --box-shadow-var: 0 0 20px 2px rgba(0, 0, 0, 0.5);
          --btn-shadow-var: 0 2px 2px 2px rgba(0, 0, 0, 0.3);
          --btn-color: #2c2c2c;
          --btn-edge: rgba(255, 255, 255, .16);
          --song-color: #00B0CC;
        }
      }
      body.black {
        --bg-color: black;
      }
      body.white {
        --font-color: white;
      }

      /*===============================*/
      /* First non-presentation styles */
      /*===============================*/
      *{
        box-sizing: border-box;
      }
      .slide {
        transition: .25s;
        padding: 1rem;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1;
      }
      #pre_slide {
        transform: translateX(-100%);
        overflow: hidden;             /* text can overflow to the right */
      }

      #post_slide {
        transform: translateX(100%);
      }

      body {
        color: var(--font-color);
        background-color: var(--bg-color);
      }

      stitle, author, scripture_ref, copyright, line {display: block; white-space: pre;}

      #songbook {
        float: left;
        white-space: nowrap;
      }
      chunk {
        display: block;
      }

      stitle {
        font-weight: bold;
        counter-reset: verse;
      }
      song chunk[type=verse]:before {
        content: counter(verse) ':';
        counter-increment: verse;
      }
      body.presentation chunk[type=verse]:before { /* hide counter in presentation */
        content: '';
      }
      chunk:before {content: "";}
      chunk[type=pre-chorus]:before {
        content: 'Pre-Chorus:';
      }
      chunk[type=chorus]:before {
        content: 'Chorus:';
      }
      chunk[type="final chorus"]:before {
        content: 'Final Chorus:';
      }
      chunk[type=bridge]:before {
        content: 'Bridge:';
      }
      chunk[type=ending]:before {
        content: 'Ending:';
      }
      .no_display {display: none;}

      #statusbar {
        position: fixed;
        bottom: 0px;
        background-color: var(--bg-color);
        width: 100%;
        z-index: 2;
      }

      #searchbox {
        border: solid 1px gray;
      }

      #progress {
        height: 0.3em;
        display: flex;
        flex-direction: row;
      }
      #progress div {
        flex-basis: 0;
        flex-grow: 1;
        background-color: gray;
      }
      #progress div:not(:first-child) {
        margin-left: 2px;
      }
      #progress .before {
        filter: opacity(0.4);
      }
      #progress .current {
        filter: opacity(1);
      }
      #progress .after {
        filter: opacity(0.4);
      }
      #progress [class*="chorus"] {
        background-color: green;
      }
      #progress .verse {
        background-color: blue;
      }
      #progress .bridge {
        background-color: yellow;
      }
      #progress .ending {
        background-color: red;
      }
      /* Where Space goes next (#51): a small arrow over that part of the progress bar, or at its end for the
         next song. Each screen can turn it off (body.nomarker). */
      #progress {
        position: relative;
      }
      #progress .space-next {
        position: relative;
      }
      #progress .space-next::after, #progress.space-next-song::after {
        content: '';
        position: absolute;
        bottom: 100%;
        left: 50%;
        margin: 0 0 .15em -.35em;
        border: .35em solid transparent;
        border-bottom: 0;
        border-top-color: gray;
      }
      #progress.space-next-song::after {
        left: auto;
        right: .2em;
      }
      /* Whole song (#51): every part on screen in columns that fit it, the one being sung clear and the rest
         faded; the part Space goes to has a line beside it */
      body.wholesong #pre_slide, body.wholesong #post_slide {
        display: none;
      }
      body.wholesong #cur_slide .content {
        height: calc(100vh - 2.5rem);
        column-width: 16em;
        column-gap: 2em;
        column-fill: auto;
      }
      body.wholesong #cur_slide chunk {
        break-inside: avoid;
        margin-bottom: .6em;
        opacity: .4;
        transition: opacity .25s;
      }
      body.wholesong #cur_slide chunk.current {
        opacity: 1;
        outline: max(2px, .06em) solid var(--pick-color);
        outline-offset: .15em;
        border-radius: .3em;
      }
      /* the part Space goes to: a small triangle at its left, so only the part on screen looks shown */
      body.wholesong #cur_slide chunk {
        position: relative;
        padding-left: .7em;
      }
      body.wholesong #cur_slide chunk.space-next {
        opacity: .6;
      }
      body.wholesong #cur_slide chunk.space-next::after {
        content: '';
        position: absolute;
        left: 0;
        top: .3em;
        border: .3em solid transparent;
        border-left: .45em solid var(--font-color);
        border-right: 0;
      }
      body.wholesong.nomarker #cur_slide chunk.space-next {
        opacity: .4;
      }
      body.wholesong.nomarker #cur_slide chunk.space-next::after {
        display: none;
      }
      body.wholesong #cur_slide copyright {
        font-size: large;
      }
      /* A part in the whole song or the grid can be clicked to show it */
      body.wholesong #cur_slide chunk[data-part] {
        cursor: pointer;
      }
      /* Grid (#51): a card for each part, the one on screen outlined, the one Space goes to dashed */
      body.gridview #pre_slide, body.gridview #post_slide {
        display: none;
      }
      body.gridview #cur_slide {
        overflow-y: auto;
        bottom: .5rem;
      }
      body.gridview #cur_slide .content {
        font-size: 1rem;
      }
      .grid-song {
        margin-bottom: .5rem;
      }
      .grid-song-head {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: .5rem;
        padding: .4rem 2rem .4rem .5rem;
        border-radius: .5rem;
        cursor: pointer;
      }
      .grid-song-head:hover {
        background-color: rgba(128, 128, 128, .12);
      }
      .grid-song-head stitle {
        display: inline;
        font-size: 1.2rem;
      }
      .grid-song.on-screen .grid-song-head stitle {
        font-size: 1.5rem;
      }
      /* a small triangle: pointing right for a closed song, down for an open one */
      .grid-toggle {
        display: inline-block;
        width: 0;
        height: 0;
        border: .3rem solid transparent;
        border-left: .45rem solid gray;
        border-right: 0;
        align-self: center;
      }
      .grid-toggle.open {
        border: .3rem solid transparent;
        border-top: .45rem solid gray;
        border-bottom: 0;
      }
      .grid-count {
        font-size: .8rem;
        color: gray;
      }
      .grid-song .grid {
        margin: .25rem 0 .75rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: .75rem;
      }
      .grid-card {
        position: relative;
        border: 2px solid lightgray;
        border-radius: .75rem;
        padding: .5rem .75rem;
        min-height: 6rem;
        cursor: pointer;
        overflow: hidden;
        font-weight: normal;
      }
      .grid-card:hover {
        border-color: gray;
      }
      .grid-card.current {
        border-color: var(--pick-color);
        box-shadow: 0 0 0 1px var(--pick-color);
      }
      /* the part (or the next song) Space goes to: a small triangle */
      .grid-card.space-next::after, .grid-song-head.space-next::after {
        content: '';
        position: absolute;
        top: .55rem;
        right: .6rem;
        border: .4rem solid transparent;
        border-left: .6rem solid var(--font-color);
        border-right: 0;
      }
      .grid-song-head.space-next::after {
        top: 50%;
        margin-top: -.4rem;
      }
      body.nomarker .grid-card.space-next::after, body.nomarker .grid-song-head.space-next::after {
        display: none;
      }
      .grid-card line {
        margin-left: 0;
        padding-top: 0;
        bottom: 0;
        white-space: pre-wrap;
        font-size: .9rem;
      }
      .grid-card c {
        display: none;
      }
      .grid-label {
        display: block;
        margin-bottom: .25rem;
        font-size: .75rem;
        font-style: italic;
        color: gray;
      }
      .view-line label {
        margin-left: .75rem;
      }
      body.nomarker #progress .space-next::after, body.nomarker #progress.space-next-song::after {
        display: none;
      }

      #searchbox {
        display: none;
      }

      #searchresults .count {
        color: gray;
      }
      #searchresults .song {
        font-weight: bold;
      }
      #searchresults .match {
        color: red;
      }

      /*====================================*/
      /* Presentation style overrides below */
      /*====================================*/
      body.presentation chunk span {display: block;}
      body.presentation stitle,
      body.presentation chunk,
      body.presentation .booktitle {
        clear: both;
        font-weight: bold;
      }

      body.presentation copyright {
        white-space: pre-wrap;                  //css-3
        white-space: -moz-pre-wrap !important;  //Mozilla, since 1999
        white-space: -pre-wrap;                 //Opera 4-6
        white-space: -o-pre-wrap;               //Opera 7
        word-wrap: break-word;                  //Internet Explorer 5.5+
      }

      body.presentation author, 
      body.presentation copyright,
      body.presentation scripture_ref {
        padding-right: 1em;
        font-size: x-large;
        font-style: italic;
        float: left;
      }
      body.presentation key {
        padding-right: 1em;
        font-size: x-large;
        font-style: italic;
        float: right;
      }
      body.presentation key:not(:empty):before {
        content: 'Key: ';
      }

      html, body, #songboook {
        padding: 0px;
        margin: 0px;
      }

      /* ---- The panels over the slides: Help & Settings, Presentation Stats, the suggest form, the suggestion
         card and the live bar (#51). They take the app's theme colors (style.css), copied in by syncTheme() and
         kept in step when the app's theme changes; the values here are the app's light theme, for a page on
         its own (a downloaded file). The slides keep their own colors (--font-color, --bg-color). */
      #help, #report, #suggestBox {
        background-color: rgba(var(--background-color-rgb), .35);
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        z-index: 5;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 1rem;
        overflow-y: auto;
      }
      #help, #report, #suggestBox, #sugCard, #liveBar, #joinCard {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
        font-weight: normal;
      }
      #help > div, #report > div, #suggestBox > div {
        position: relative;
        background-color: var(--background-color);
        color: var(--text-color);
        border-radius: 1.25rem;
        padding: 0 1.25rem 1rem;
        max-width: 620px;
        margin-left: auto;
        margin-right: auto;
        box-shadow: var(--box-shadow-var);
      }
      #report > div, #suggestBox > div {
        padding-top: 1rem;
      }
      /* Help & Settings scrolls inside its own card, so its header stays at the card's top */
      #help {
        overflow: hidden;
      }
      #help > div {
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      #searchbox,
      #searchbox input {
        color: gray;
      }
      #searchbox input {
        background: transparent;
      }
      #searchbox input:focus {
        outline-color: gray;
      }
      /* A button the way the app draws one (style.css .btn): a rounded pill with a soft shadow */
      #help .btn, #report .btn, #suggestBox .btn, #sugCard .btn {
        box-shadow: var(--btn-shadow-var), inset 0 0 0 1px var(--btn-edge);
        border: none;
        font: inherit;
        font-weight: bold;
        background-color: var(--btn-color);
        color: var(--text-color);
        border-radius: 2rem;
        padding: .3125rem .9375rem;
        margin: 0 0 0 .75rem;
        cursor: pointer;
      }
      #help .btn:active, #report .btn:active, #suggestBox .btn:active, #sugCard .btn:active {
        transform: scale3d(0.9, 0.9, 1);
      }
      #help .btn.btn-stop {
        color: #e0524a;
      }

      /* Help & Settings: a header that stays put while the panel scrolls, then sections */
      #help .help-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .5rem;
        margin: 0 -1.25rem;
        padding: 1rem 1.25rem .75rem;
        border-radius: 1.25rem 1.25rem 0 0;
        background-color: var(--background-color);
        border-bottom: 1px solid rgba(128, 128, 128, .25);
      }
      #help .help-head h3 {
        flex: 1;
        margin: 0;
        font-size: 1.2rem;
      }
      #help .help-head .btn {
        margin: 0;
        font-size: .85rem;
      }
      #help .help-close {
        border: none;
        background: none;
        color: var(--light-text-color);
        font: inherit;
        font-size: 1.6rem;
        line-height: 1;
        padding: 0 .25rem;
        cursor: pointer;
      }
      #help .help-close:hover {
        color: var(--text-color);
      }
      #help section, #help details {
        padding: .9rem 0 .2rem;
        border-bottom: 1px solid rgba(128, 128, 128, .25);
      }
      #help details:last-child {
        border-bottom: none;
      }
      #help h4, #help summary {
        margin: 0 0 .7rem;
        font-size: 1rem;
        font-weight: bold;
      }
      #help summary {
        cursor: pointer;
        list-style-position: inside;
      }
      #help .help-note {
        flex: 1 1 14rem;
        margin: 0 0 .7rem;
        font-size: .85rem;
        color: var(--light-text-color);
      }
      #help .screen-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .5rem .75rem;
        margin-bottom: .8rem;
      }
      #help .screen-row .btn {
        margin: 0;
      }
      #help .screen-row .help-note {
        margin: 0;
      }
      /* the app's Chords switch (style.css .chord-switch, .switch-track) */
      #help .switches {
        display: flex;
        flex-wrap: wrap;
        gap: .6rem 1.4rem;
        margin-bottom: .9rem;
      }
      #help .switches.stacked {
        flex-direction: column;
        gap: .55rem;
      }
      .chord-switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: .45rem;
        color: var(--text-color);
        cursor: pointer;
        user-select: none;
      }
      .chord-switch input {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .switch-track {
        position: relative;
        flex: none;
        width: 1.8rem;
        height: 1rem;
        border-radius: 1rem;
        background: rgba(128, 128, 128, .45);
        transition: background .2s;
      }
      .switch-track::after {
        content: '';
        position: absolute;
        top: .125rem;
        left: .125rem;
        width: .75rem;
        height: .75rem;
        border-radius: 50%;
        background: var(--background-color);
        box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
        transition: transform .2s;
      }
      .chord-switch input:checked + .switch-track {
        background: var(--song-color);
      }
      .chord-switch input:checked + .switch-track::after {
        transform: translateX(.8rem);
      }
      .chord-switch input:focus-visible + .switch-track {
        outline: 2px solid var(--song-color);
        outline-offset: 2px;
      }
      .chord-switch input:disabled + .switch-track {
        opacity: .5;
      }
      /* One part / Whole song / Grid: one button in three parts, the one in use filled */
      #help .segmented {
        display: inline-flex;
        margin-bottom: .6rem;
        border-radius: 2rem;
        box-shadow: var(--btn-shadow-var), inset 0 0 0 1px var(--btn-edge);
        background-color: var(--btn-color);
        overflow: hidden;
      }
      #help .segmented label {
        position: relative;
        padding: .35rem 1rem;
        font-weight: bold;
        font-size: .9rem;
        cursor: pointer;
      }
      #help .segmented label + label {
        border-left: 1px solid rgba(128, 128, 128, .25);
      }
      #help .segmented input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      #help .segmented label:has(input:checked) {
        background-color: var(--song-color);
      }
      #help .segmented label:has(input:focus-visible) {
        outline: 2px solid var(--song-color);
        outline-offset: -2px;
      }
      /* Backgrounds: a row for each picture */
      #help .picture-row {
        display: grid;
        grid-template-columns: 9rem 1fr;
        align-items: center;
        gap: .2rem .75rem;
        margin-bottom: .6rem;
        font-size: .9rem;
      }
      #help .picture-row input {
        font: inherit;
        font-size: .8rem;
        color: var(--light-text-color);
        max-width: 100%;
      }
      #help .picture-row .help-note {
        grid-column: 2;
        margin: 0;
      }
      /* Keys: each key drawn as a keycap; two columns when there's room */
      #help .keys {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
        gap: .45rem 1.25rem;
        padding-bottom: .5rem;
        font-size: .88rem;
      }
      #help .keys > div {
        display: flex;
        align-items: baseline;
        gap: .6rem;
      }
      #help .keys .caps {
        flex: none;
        min-width: 5.5rem;
      }
      #help kbd {
        display: inline-block;
        min-width: 1.6em;
        margin: 0 .2em .15em 0;
        padding: .05em .4em;
        border-radius: .35em;
        background-color: var(--btn-color);
        box-shadow: 0 1px 0 1px rgba(128, 128, 128, .4), inset 0 0 0 1px var(--btn-edge);
        font: inherit;
        font-size: .85em;
        font-weight: bold;
        text-align: center;
      }
      /* Sharing: the QR code, the code and Stop sharing as one unit, then its switches */
      #help .share-unit {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .75rem 1rem;
        margin-bottom: .9rem;
      }
      #help .share-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: .35rem;
        flex: 1 1 12rem;
      }
      #help .share-info .help-note {
        flex: none;
        margin: 0;
      }
      #help .share-info .btn {
        margin: 0;
      }
      #help .share-code {
        font-size: 2rem;
        font-weight: bold;
        letter-spacing: .2em;
      }
      #help .share-qr svg {
        display: block;
        width: 7rem;
        height: 7rem;
        background: white;
        border-radius: .5rem;
      }
      #help .share-line {
        margin: 0 0 .7rem;
      }
      #help .share-line .leader {
        white-space: nowrap;
      }
      #help .share-line .btn {
        margin: .25rem .5rem .25rem .25rem;
      }
      #help .share-problem {
        flex-basis: 100%;
        margin: 0 0 .7rem;
        color: #c0392b;
      }
      #help a {
        color: inherit;
      }
      /* Suggested songs (#51): the form a follower sends one with, and the card leaders answer on */
      #suggestBox input {
        font: inherit;
        width: 100%;
        margin: 0 0 .75rem;
        padding: .4rem .6rem;
        border: 1px solid rgba(128, 128, 128, .45);
        border-radius: .5rem;
        color: var(--text-color);
        background: transparent;
      }
      #suggestBox .btn:first-child {
        margin-left: 0;
      }
      #sugCard {
        position: fixed;
        top: .75rem;
        left: .75rem;
        z-index: 4;
        max-width: 20rem;
        padding: .5rem .75rem;
        border-radius: 1rem;
        background-color: var(--background-color);
        color: var(--light-text-color);
        box-shadow: var(--btn-shadow-var), inset 0 0 0 1px var(--btn-edge);
        font-size: .85rem;
      }
      #sugCard .sug {
        padding: .3rem 0;
      }
      #sugCard .sug + .sug {
        border-top: 1px solid rgba(128, 128, 128, .25);
      }
      #sugCard .sug-song {
        color: var(--text-color);
        font-weight: bold;
      }
      #sugCard .btn {
        margin: .25rem .4rem 0 0;
        font-size: .8rem;
      }
      #sugCard[hidden], #suggestBox[hidden] {
        display: none;
      }
      /* Whole song and Grid: a big Menu button for touch screens (the live bar's ? does it when it shows) */
      #menuButton {
        display: none;
        position: fixed;
        top: .75rem;
        right: .75rem;
        z-index: 4;
        min-height: 2.75rem;
        padding: .5rem 1.1rem;
        border: none;
        border-radius: 2rem;
        box-shadow: var(--btn-shadow-var), inset 0 0 0 1px var(--btn-edge);
        background-color: var(--btn-color);
        color: var(--text-color);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
      }
      body.wholesong #menuButton, body.gridview #menuButton, #menuButton.peek {
        display: block;
      }
      #menuButton {
        transition: opacity .8s;
      }
      body:not(.wholesong):not(.gridview) #menuButton.fade {
        opacity: 0;
      }
      #menuButton.start::after {
        content: '  ·  press h';
        font-weight: normal;
        color: var(--light-text-color);
        white-space: pre;
      }
      body.has-livebar #menuButton {
        display: none;
      }
      #menuButton:active {
        transform: scale3d(0.9, 0.9, 1);
      }
      body.gridview .grid-song:first-child .grid-song-head {
        margin-right: 7rem; /* the first song's name stays clear of the Menu button */
      }
      #liveBar[hidden], #liveBar [hidden] {
        display: none;
      }
      /* The join card (#51): a QR code and the code in the bottom corner, white so it scans on any background */
      #joinCard {
        position: fixed;
        right: 1.5vmin;
        bottom: calc(1.5vmin + .5em);
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 1.5vmin;
        padding: 1.2vmin 2vmin 1.2vmin 1.2vmin;
        border-radius: 2vmin;
        background: white;
        color: black;
        box-shadow: 0 2px 2px 2px rgba(0, 0, 0, 0.1);
        font-size: 2.2vmin;
      }
      #joinCard .join-qr svg {
        display: block;
        width: 22vmin;
        height: 22vmin;
      }
      #joinCard .join-text {
        display: flex;
        flex-direction: column;
        gap: .3em;
      }
      #joinCard .join-code {
        font-size: 2.3em;
        font-weight: bold;
        letter-spacing: .15em;
      }
      #joinCard .join-page {
        color: gray;
      }
      /* Following a shared presentation (#51): Live, or where the leader is, and this screen's settings */
      #liveBar {
        position: fixed;
        top: .75rem;
        right: .75rem;
        z-index: 4;
        display: flex;
        gap: .5rem;
      }
      #liveBar button {
        box-shadow: var(--btn-shadow-var), inset 0 0 0 1px var(--btn-edge);
        border: none;
        font: inherit;
        font-size: .85rem;
        font-weight: bold;
        background-color: var(--btn-color);
        color: var(--light-text-color);
        border-radius: 2rem;
        padding: .3125rem .9375rem;
        cursor: pointer;
        opacity: .6;
      }
      #liveBar button:hover, #liveBar button:focus-visible, #liveBar #livePill.wandering {
        opacity: 1;
      }
      #livePill:not(.wandering)::before {
        content: '';
        display: inline-block;
        width: .5em;
        height: .5em;
        margin-right: .4em;
        border-radius: 50%;
        background: firebrick;
        vertical-align: middle;
      }
      #livePill.wandering {
        color: var(--text-color);
      }
      #livePill.nudge {
        animation: live-nudge .4s ease-in-out 3;
      }
      @keyframes live-nudge {
        50% { transform: scale(1.12); }
      }
      /* Presentation Stats (#158): over the slides, like the help */
      #report .report-list {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed; /* the counted and the brief tables line up */
        font-size: .9rem;
      }
      #report .report-list td:nth-child(1) { width: 1.75rem; }
      #report .report-list td:nth-child(3) { width: 4.5rem; }
      #report .report-list td:nth-child(4) { width: 4.5rem; }
      #report .report-list td:nth-child(5) { width: 3.5rem; }
      #report .report-list td {
        padding: .3rem .4rem .3rem 0;
        border-top: 1px solid rgba(128, 128, 128, .25);
        vertical-align: top;
      }
      #report .report-head td {
        border-top: none;
        font-size: .8rem;
      }
      #report .report-note {
        font-size: .85rem;
        color: var(--light-text-color);
      }
      #report .report-buttons {
        text-align: right;
      }

      #helpButton {
        position: fixed;
        top: 1rem;
        right: 1rem;
        border: 1px solid white;
        padding: 12px 17px 12px 17px;
        border-radius: 200px;
        color: gray;
        backdrop-filter: blur(2px);
        font-weight: bold;
        background-color: rgba(255, 255, 255, 0.6);
        filter: drop-shadow(2px 2px 4px lightgray);
      }
      /*====================================*/
      /* Chord style overrides below        */
      /*====================================*/
      chunk:before {
        display: block;
        margin-bottom: 1em;
        font-size: 60%;
        font-style: italic; 
      }
      body.presentation chunk[type=verse] span {
        font-size: 60%;
        font-style: italic; 
      }
      body.nochords chunk:before {
        margin-bottom: 0em;
      }
      chunk[type=verse]:before {
        margin-bottom: 0em;
      }
      c {
        position: absolute;
        bottom: 1em;
        white-space: nowrap;
      }
      body.nochords c {
        display: none;
      }
      body.nochords line {
        padding-top: 0em;
        bottom: 0em;
        margin-left: 0em;
      }
      line {
        display: block;
        position: relative;
        padding-top: 1em;
        margin-left: 2em;
        bottom: 1em;
      }
      chunk {
        padding-top: 1px;  /* else in chord mode chords display over the author */
      }
      /* Bible verses (#157): a verse wraps like a paragraph (poetry keeps its lines), with its number small.
         No room for chords above it, chords on or off. */
      chunk[type="bible"] line {
        white-space: pre-line;
        padding-top: 0;
        bottom: 0;
        margin-left: 0;
        margin-bottom: .3em;
      }
      chunk[type="bible"] vn {
        font-size: 55%;
        vertical-align: super;
        line-height: 0;
        font-weight: normal;
      }
      #measure_slide {
        transform: none;
        transition: none;
      }
      /*===============================*/
      /* Background image css
      /*===============================*/
      #slides::before, #slides, #slides::after {
        content: "";
        display: block;
        background-position: bottom;
        background-size: cover;
        background-repeat: no-repeat;
        position: fixed;
        top:0;
        right:0;
        left:0;
        bottom: 0;
        overflow: hidden;
      }
      #slides::before {
        background-image: var(--bg-image);
        background-repeat: no-repeat;
        width: 110vw;
        height: 110vh;
        transform: translate3d(calc(.2% - var(--percent)*.04%),0,0);
        z-index: -2;
        transition: 2s;
      }
      #slides {
        background-image: var(--fixed-image);
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }
      #slides::after {
        background-image: var(--fg-image);
        width: 100vw;
        height: 100vh;
        transform: translate3d(calc(-5% + var(--percent)*.1%),0,0);
        transition: 2s;
      }
    </style>
    <title></title>
  </head>
  <body class="nochords presentation">
  
  <!-- Dynamically loaded into these divs for transitions, etc.-->
  <div id="slides">
    <div id="pre_slide" class="slide">
      <div class="content"></div>
    </div>
    <div id="cur_slide" class="slide">
      <div class="content">
        <div style="width: calc(100% - 2rem); position: absolute; top: 40%;"><div style="text-align: center"><h1>Presenting</h1><h2><i id="pres_title">Lorem Ipsum</i></h2></div></div>
      </div>
    </div>
    <div id="post_slide" class="slide">
      <div class="content"></div>
    </div>
  </div>

  <div id="statusbar">
    <div id="searchbox" style="display: none;">
      <div id="searchresults"></div>
      <input id="searchinput" type="text" autocomplete="off" /><span class="info"></span>
      <info id="helpButton" onclick="toggleHelp(); endSearch();">?</info>
      </div>
    <div id="progress"></div>
  </div>
  <footer id="data" data="songbookData">
  </footer>

  <script type="text/javascript">presentation_embed</script>
</body>
</html>
