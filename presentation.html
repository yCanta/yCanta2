<!DOCTYPE html>
<html lang="en">
  <!-- keep this valid HTML5 http://html5.validator.nu/ -->
  <head>
    <meta charset="UTF-8" />

    <style type="text/css">
      :root {
        --font-color: black;
        --bg-color: white;
        --bg-image: url("");
        --fixed-image: url("");
        --fg-image: url("");
      }
      body.black {
        --bg-color: black;
      }
      body.white {
        --font-color: white;
      }

      /*===============================*/
      /* First non-presentation styles */
      /*===============================*/
      *{
        box-sizing: border-box;
      }
      .slide {
        transition: .25s;
        padding: 1rem;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1;
      }
      #pre_slide {
        transform: translateX(-100%);
        overflow: hidden;             /* text can overflow to the right */
      }

      #post_slide {
        transform: translateX(100%);
      }

      body {
        color: var(--font-color);
        background-color: var(--bg-color);
      }

      stitle, author, scripture_ref, copyright, line {display: block; white-space: pre;}

      #songbook {
        float: left;
        white-space: nowrap;
      }
      chunk {
        display: block;
      }

      stitle {
        font-weight: bold;
        counter-reset: verse;
      }
      song chunk[type=verse]:before {
        content: counter(verse) ':';
        counter-increment: verse;
      }
      body.presentation chunk[type=verse]:before { /* hide counter in presentation */
        content: '';
      }
      chunk:before {content: "";}
      chunk[type=pre-chorus]:before {
        content: 'Pre-Chorus:';
      }
      chunk[type=chorus]:before {
        content: 'Chorus:';
      }
      chunk[type="final chorus"]:before {
        content: 'Final Chorus:';
      }
      chunk[type=bridge]:before {
        content: 'Bridge:';
      }
      chunk[type=ending]:before {
        content: 'Ending:';
      }
      .no_display {display: none;}

      #statusbar {
        position: fixed;
        bottom: 0px;
        background-color: var(--bg-color);
        width: 100%;
        z-index: 2;
      }

      #searchbox {
        border: solid 1px gray;
      }

      #progress {
        height: 0.3em;
        display: flex;
        flex-direction: row;
      }
      #progress div {
        flex-basis: 0;
        flex-grow: 1;
        background-color: gray;
      }
      #progress div:not(:first-child) {
        margin-left: 2px;
      }
      #progress .before {
        filter: opacity(0.4);
      }
      #progress .current {
        filter: opacity(1);
      }
      #progress .after {
        filter: opacity(0.4);
      }
      #progress [class*="chorus"] {
        background-color: green;
      }
      #progress .verse {
        background-color: blue;
      }
      #progress .bridge {
        background-color: yellow;
      }
      #progress .ending {
        background-color: red;
      }
      /* Where Space goes next (#51): a small arrow over that part of the progress bar, or at its end for the
         next song. Each screen can turn it off (body.nomarker). */
      #progress {
        position: relative;
      }
      #progress .space-next {
        position: relative;
      }
      #progress .space-next::after, #progress.space-next-song::after {
        content: '';
        position: absolute;
        bottom: 100%;
        left: 50%;
        margin: 0 0 .15em -.35em;
        border: .35em solid transparent;
        border-bottom: 0;
        border-top-color: gray;
      }
      #progress.space-next-song::after {
        left: auto;
        right: .2em;
      }
      /* Whole song (#51): every part on screen in columns that fit it, the one being sung clear and the rest
         faded; the part Space goes to has a line beside it */
      body.wholesong #pre_slide, body.wholesong #post_slide {
        display: none;
      }
      body.wholesong #cur_slide .content {
        height: calc(100vh - 2.5rem);
        column-width: 16em;
        column-gap: 2em;
        column-fill: auto;
      }
      body.wholesong #cur_slide chunk {
        break-inside: avoid;
        margin-bottom: .6em;
        opacity: .4;
        transition: opacity .25s;
      }
      body.wholesong #cur_slide chunk.current {
        opacity: 1;
      }
      body.wholesong #cur_slide chunk.space-next {
        opacity: .7;
        box-shadow: inset .12em 0 0 gray;
        padding-left: .4em;
      }
      body.wholesong.nomarker #cur_slide chunk.space-next {
        opacity: .4;
        box-shadow: none;
        padding-left: 0;
      }
      body.wholesong #cur_slide copyright {
        font-size: large;
      }
      /* A part in the whole song or the grid can be clicked to show it */
      body.wholesong #cur_slide chunk[data-part] {
        cursor: pointer;
      }
      /* Grid (#51): a card for each part, the one on screen outlined, the one Space goes to dashed */
      body.gridview #pre_slide, body.gridview #post_slide {
        display: none;
      }
      body.gridview #cur_slide {
        overflow-y: auto;
        bottom: .5rem;
      }
      body.gridview #cur_slide .content {
        font-size: 1rem;
      }
      body.gridview .grid-head stitle {
        font-size: 1.5rem;
        margin-bottom: .75rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: .75rem;
      }
      .grid-card {
        border: 2px solid lightgray;
        border-radius: .75rem;
        padding: .5rem .75rem;
        min-height: 6rem;
        cursor: pointer;
        overflow: hidden;
        font-weight: normal;
      }
      .grid-card:hover {
        border-color: gray;
      }
      .grid-card.current {
        border-color: var(--font-color);
        box-shadow: 0 0 0 1px var(--font-color);
      }
      .grid-card.space-next {
        border-style: dashed;
        border-color: gray;
      }
      body.nomarker .grid-card.space-next:not(.current) {
        border-style: solid;
        border-color: lightgray;
      }
      .grid-card line {
        margin-left: 0;
        padding-top: 0;
        bottom: 0;
        white-space: pre-wrap;
        font-size: .9rem;
      }
      .grid-card c {
        display: none;
      }
      .grid-label {
        display: block;
        margin-bottom: .25rem;
        font-size: .75rem;
        font-style: italic;
        color: gray;
      }
      .view-line label {
        margin-left: .75rem;
      }
      body.nomarker #progress .space-next::after, body.nomarker #progress.space-next-song::after {
        display: none;
      }

      #searchbox {
        display: none;
      }

      #searchresults .count {
        color: gray;
      }
      #searchresults .song {
        font-weight: bold;
      }
      #searchresults .match {
        color: red;
      }

      /*====================================*/
      /* Presentation style overrides below */
      /*====================================*/
      body.presentation chunk span {display: block;}
      body.presentation stitle,
      body.presentation chunk,
      body.presentation .booktitle {
        clear: both;
        font-weight: bold;
      }

      body.presentation copyright {
        white-space: pre-wrap;                  //css-3
        white-space: -moz-pre-wrap !important;  //Mozilla, since 1999
        white-space: -pre-wrap;                 //Opera 4-6
        white-space: -o-pre-wrap;               //Opera 7
        word-wrap: break-word;                  //Internet Explorer 5.5+
      }

      body.presentation author, 
      body.presentation copyright,
      body.presentation scripture_ref {
        padding-right: 1em;
        font-size: x-large;
        font-style: italic;
        float: left;
      }
      body.presentation key {
        padding-right: 1em;
        font-size: x-large;
        font-style: italic;
        float: right;
      }
      body.presentation key:not(:empty):before {
        content: 'Key: ';
      }

      html, body, #songboook {
        padding: 0px;
        margin: 0px;
      }

      #help, #report, #suggestBox {
        background-color: rgba(255, 255, 255, 0.1);
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        z-index: 5;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 1rem;
        overflow-y: auto;
      }
      #help > div, #report > div, #suggestBox > div {
        background-color: var(--bg-color);
        border-radius: 2rem;
        padding: 1rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        filter: drop-shadow(2px 2px 4px lightgray);
      }
      #help > div > *, #report > div > *, #suggestBox > div > *,
      #searchbox,
      #searchbox input {
        color: gray;
      }
      #searchbox input {
        background: transparent;
      }
      #searchbox input:focus {
        outline-color: gray;
      }
      .helpLine {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      } 
      .helpLine > * {
        margin-bottom: 1rem;
      }
      #files {
        display: grid;
        grid-template-columns: 1fr 3fr;
      }

      /*Switch*/
      .switch {
        position: relative;
        display: inline-block;
        width: 90px;
        height: 34px;
        vertical-align: middle;
      }
      .switch input {display:none;}
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        transition: .4s;
        border-radius: 34px;
        border: 1px solid gray;
      }
      .slider.font {
        background-color: lightgray;
        color: black;
      }
      .slider.background {
        background-color: white;
        color: gray;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 4px;
        bottom: 6px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
      }
      .slider.background:before {
        background-color: gray;
      }
      input:checked + .slider.font {
        color: white;
      }
      input:checked + .slider.background {
        background-color: black;
      }
      input:focus + .slider {
        box-shadow: 0 0 1px #2196F3;
      }
      input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(60px);
      }
      /*------ ADDED CSS ---------*/
      .slider:after {
       content: attr(data-text);
       display: block;
       position: absolute;
       transform: translate(-50%,-50%);
       top: 50%;
       left: 50%;
       font-size: 12px;
       font-family: Verdana, sans-serif;
       font-weight: bold;
      }
      /*End Switch*/

      #help td.description {
        padding-left: 1em;
      }
      /* A button the way the app draws one (style.css .btn): a rounded pill with a soft shadow */
      #help .btn, #report .btn, #suggestBox .btn, #sugCard .btn {
        box-shadow: 0 2px 2px 2px rgba(0, 0, 0, 0.1);
        border: none;
        font: inherit;
        font-weight: bold;
        background-color: white;
        color: black;
        border-radius: 2rem;
        padding: .3125rem .9375rem;
        margin: 0 0 0 .75rem;
        cursor: pointer;
      }
      #help .help-top {
        margin: 0 0 1rem 0;
        text-align: right;
      }
      /* Other screens (#51): a button with a short note beside it */
      #help .screen-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .5rem .75rem;
        margin-bottom: 1rem;
      }
      #help .screen-row .btn {
        margin: 0;
      }
      #help .help-note {
        flex: 1 1 14rem;
        font-size: .85rem;
      }
      #help .share-code {
        font-size: 2rem;
        font-weight: bold;
        letter-spacing: .2em;
        color: var(--font-color);
      }
      #help .share-line {
        flex-basis: 100%;
        margin: 0;
      }
      #help .share-line .leader {
        white-space: nowrap;
      }
      #help .share-line .btn {
        margin: .25rem .5rem .25rem .25rem;
      }
      /* Suggested songs (#51): the form a follower sends one with, and the card leaders answer on */
      #suggestBox input {
        font: inherit;
        width: 100%;
        margin: 0 0 .75rem;
        padding: .4rem .6rem;
        border: 1px solid lightgray;
        border-radius: .5rem;
        color: var(--font-color);
        background: transparent;
      }
      #suggestBox .btn:first-child {
        margin-left: 0;
      }
      #sugCard {
        position: fixed;
        top: .75rem;
        left: .75rem;
        z-index: 4;
        max-width: 20rem;
        padding: .5rem .75rem;
        border-radius: 1rem;
        background-color: var(--bg-color);
        color: gray;
        box-shadow: 0 2px 2px 2px rgba(0, 0, 0, 0.1);
        font-size: .85rem;
      }
      #sugCard .sug {
        padding: .3rem 0;
      }
      #sugCard .sug + .sug {
        border-top: 1px solid lightgray;
      }
      #sugCard .sug-song {
        color: var(--font-color);
        font-weight: bold;
      }
      #sugCard .btn {
        margin: .25rem .4rem 0 0;
        font-size: .8rem;
      }
      #sugCard[hidden], #suggestBox[hidden] {
        display: none;
      }
      #liveBar[hidden], #liveBar [hidden] {
        display: none;
      }
      #help .share-problem {
        flex-basis: 100%;
        margin: 0;
        color: firebrick;
      }
      /* Following a shared presentation (#51): Live, or where the leader is, and this screen's settings */
      #liveBar {
        position: fixed;
        top: .75rem;
        right: .75rem;
        z-index: 4;
        display: flex;
        gap: .5rem;
      }
      #liveBar button {
        box-shadow: 0 2px 2px 2px rgba(0, 0, 0, 0.1);
        border: none;
        font: inherit;
        font-size: .85rem;
        font-weight: bold;
        background-color: white;
        color: gray;
        border-radius: 2rem;
        padding: .3125rem .9375rem;
        cursor: pointer;
        opacity: .6;
      }
      #liveBar button:hover, #liveBar button:focus-visible, #liveBar #livePill.wandering {
        opacity: 1;
      }
      #livePill:not(.wandering)::before {
        content: '';
        display: inline-block;
        width: .5em;
        height: .5em;
        margin-right: .4em;
        border-radius: 50%;
        background: firebrick;
        vertical-align: middle;
      }
      #livePill.wandering {
        color: black;
      }
      #livePill.nudge {
        animation: live-nudge .4s ease-in-out 3;
      }
      @keyframes live-nudge {
        50% { transform: scale(1.12); }
      }
      /* What's been presented (#158): over the slides, like the help */
      #report .report-list {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed; /* the counted and the brief tables line up */
        font-size: .9rem;
      }
      #report .report-list td:nth-child(1) { width: 1.75rem; }
      #report .report-list td:nth-child(3) { width: 4.5rem; }
      #report .report-list td:nth-child(4) { width: 4.5rem; }
      #report .report-list td:nth-child(5) { width: 3.5rem; }
      #report .report-list td {
        padding: .3rem .4rem .3rem 0;
        border-top: 1px solid lightgray;
        vertical-align: top;
      }
      #report .report-head td {
        border-top: none;
        font-size: .8rem;
      }
      #report .report-note {
        font-size: .85rem;
      }
      #report .report-buttons {
        text-align: right;
      }
      /* The help's list of keys */
      #help .keys td {
        padding: .15rem 0;
        vertical-align: top;
      }
      #help .keys td.key {
        padding-right: .75rem;
        white-space: nowrap;
        font-weight: bold;
      }

      #help .newdescription td {
        border-top: solid 1px black;
        padding-top: 5px;
        margin-top: 5px;
      }

      #helpButton {
        position: fixed;
        top: 1rem;
        right: 1rem;
        border: 1px solid white;
        padding: 12px 17px 12px 17px;
        border-radius: 200px;
        color: gray;
        backdrop-filter: blur(2px);
        font-weight: bold;
        background-color: rgba(255, 255, 255, 0.6);
        filter: drop-shadow(2px 2px 4px lightgray);
      }
      /*====================================*/
      /* Chord style overrides below        */
      /*====================================*/
      chunk:before {
        display: block;
        margin-bottom: 1em;
        font-size: 60%;
        font-style: italic; 
      }
      body.presentation chunk[type=verse] span {
        font-size: 60%;
        font-style: italic; 
      }
      body.nochords chunk:before {
        margin-bottom: 0em;
      }
      chunk[type=verse]:before {
        margin-bottom: 0em;
      }
      c {
        position: absolute;
        bottom: 1em;
        white-space: nowrap;
      }
      body.nochords c {
        display: none;
      }
      body.nochords line {
        padding-top: 0em;
        bottom: 0em;
        margin-left: 0em;
      }
      line {
        display: block;
        position: relative;
        padding-top: 1em;
        margin-left: 2em;
        bottom: 1em;
      }
      chunk {
        padding-top: 1px;  /* else in chord mode chords display over the author */
      }
      /* Bible verses (#157): a verse wraps like a paragraph (poetry keeps its lines), with its number small.
         No room for chords above it, chords on or off. */
      chunk[type="bible"] line {
        white-space: pre-line;
        padding-top: 0;
        bottom: 0;
        margin-left: 0;
        margin-bottom: .3em;
      }
      chunk[type="bible"] vn {
        font-size: 55%;
        vertical-align: super;
        line-height: 0;
        font-weight: normal;
      }
      #measure_slide {
        transform: none;
        transition: none;
      }
      /*===============================*/
      /* Background image css
      /*===============================*/
      #slides::before, #slides, #slides::after {
        content: "";
        display: block;
        background-position: bottom;
        background-size: cover;
        background-repeat: no-repeat;
        position: fixed;
        top:0;
        right:0;
        left:0;
        bottom: 0;
        overflow: hidden;
      }
      #slides::before {
        background-image: var(--bg-image);
        background-repeat: no-repeat;
        width: 110vw;
        height: 110vh;
        transform: translate3d(calc(.2% - var(--percent)*.04%),0,0);
        z-index: -2;
        transition: 2s;
      }
      #slides {
        background-image: var(--fixed-image);
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }
      #slides::after {
        background-image: var(--fg-image);
        width: 100vw;
        height: 100vh;
        transform: translate3d(calc(-5% + var(--percent)*.1%),0,0);
        transition: 2s;
      }
    </style>
    <title></title>
  </head>
  <body class="nochords presentation">
  
  <!-- Dynamically loaded into these divs for transitions, etc.-->
  <div id="slides">
    <div id="pre_slide" class="slide">
      <div class="content"></div>
    </div>
    <div id="cur_slide" class="slide">
      <div class="content">
        <div style="width: calc(100% - 2rem); position: absolute; top: 40%;"><div style="text-align: center"><h1>Presenting</h1><h2><i id="pres_title">Lorem Ipsum</i></h2></div></div>
      </div>
    </div>
    <div id="post_slide" class="slide">
      <div class="content"></div>
    </div>
  </div>

  <div id="statusbar">
    <div id="searchbox" style="display: none;">
      <div id="searchresults"></div>
      <input id="searchinput" type="text" autocomplete="off" /><span class="info"></span>
      <info id="helpButton" onclick="toggleHelp(); endSearch();">?</info>
      </div>
    <div id="progress"></div>
  </div>
  <footer id="data" data="songbookData">
  </footer>

  <script type="text/javascript">presentation_embed</script>
</body>
</html>
