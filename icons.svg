<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- yCanta's icons, drawn for yCanta and given to the public domain like the rest of it (Unlicense).
     Each is a 24x24 line drawing in the text color. Use one with
     <svg class="icon" aria-hidden="true"><use href="icons.svg#edit"/><symbol id="shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v6h6M10 20v-6H4M14 10l6.5-6.5M10 14l-6.5 6.5"/></symbol>
<symbol id="clear" viewBox="0 0 24 24"><mask id="clear-cut"><rect width="24" height="24" fill="white"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5" stroke="black" stroke-width="1.8" stroke-linecap="round"/></mask><circle cx="12" cy="12" r="8" fill="currentColor" stroke="none" mask="url(#clear-cut)"/></symbol>
</svg> (icon('edit') in lib.js).
     A few are copied as mask variables (named i-...) at the top of style.css, and three in presentation.js (presIcon):
     change a drawing there too. -->
